services:
  - type: worker
    name: hacker-code-breaker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: hacker_bot
      - key: OWNER_ID
        sync: false
    autoDeploy: true